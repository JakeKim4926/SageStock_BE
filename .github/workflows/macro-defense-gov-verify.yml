name: macro-defense-gov-verify

# Defense.gov collector 실수집 검증용 임시 워크플로 (Phase 1).
# 기사 HTML(/News/*)은 Akamai가 비미국 IP를 403 차단해 미국 러너에서만 실수집이 가능하다
# (RSS.ashx만 전역 허용 — collector 모듈 docstring 참조). 검증 후 제거 예정,
# 정식 cron 배선은 Phase 4 (PLAN.md).
on:
  workflow_dispatch: {}
  push:
    branches: [feature/macro-phase1-collectors]
    paths: [".github/workflows/macro-defense-gov-verify.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install uv && uv sync --frozen
      # 임시 프로브: 러너(미국 IP)에서도 기사 HTML 403 — 접근 가능한 변형 탐색
      - name: Probe article access variants
        run: |
          ART="https://www.war.gov/News/Contracts/Contract/Article/4532515/contracts-for-july-2-2026/"
          UA_CHROME="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          probe() { echo "== $1"; shift; curl -s -o /tmp/out -w "%{http_code} %{size_download}\n" "$@" || true; }
          probe "chrome http1.1" --http1.1 -A "$UA_CHROME" "$ART"
          probe "chrome http2 + headers" --http2 -A "$UA_CHROME" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" -H "Sec-Fetch-User: ?1" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H 'sec-ch-ua: "Not/A)Brand";v="8", "Chromium";v="126", "Google Chrome";v="126"' \
            -H "sec-ch-ua-mobile: ?0" -H 'sec-ch-ua-platform: "Windows"' "$ART"
          probe "no UA" "$ART"
          probe "googlebot" -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "$ART"
          probe "curl default UA + defense.gov" -L "https://www.defense.gov/News/Contracts/Contract/Article/4532515/contracts-for-july-2-2026/"
          probe "print.aspx" -A "$UA_CHROME" "https://www.war.gov/DesktopModules/ArticleCS/Print.aspx?PortalId=1&ModuleId=1153&Article=4532515"
          probe "rss ok control" -A "$UA_CHROME" -L "https://www.war.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=400&Site=945&max=10"
          echo "== googlebot body head =="; head -c 300 /tmp/out || true
      # 임시 프로브 2: curl/httpx JA3 차단 가설 — 실제 Chromium이면 통과하는지
      - name: Probe with real Chromium (playwright)
        run: |
          pip install playwright > /dev/null && python -m playwright install chromium --with-deps > /dev/null 2>&1
          python - <<'PYEOF'
          from playwright.sync_api import sync_playwright
          url = "https://www.war.gov/News/Contracts/Contract/Article/4532515/contracts-for-july-2-2026/"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              resp = page.goto(url, wait_until="domcontentloaded", timeout=60000)
              html = page.content()
              print("status:", resp.status, "html_len:", len(html))
              print("has body div:", '<div class="body">' in html)
              print("has RAND:", "RAND National Defense" in html)
              browser.close()
          PYEOF
      - name: Run defense_gov collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m app.batch.run_macro_collectors defense_gov
