# Render Blueprint. 무료 웹서비스로 FastAPI 백엔드 배포.
# 시크릿(DATABASE_URL 등)은 레포에 두지 않음 → 대시보드에서 주입(sync:false).
services:
  - type: web
    name: sagestock-be
    runtime: python
    plan: free
    region: singapore # Neon ap-southeast-1과 동일 리전으로 레이턴시 최소화
    branch: develop
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL # Neon connection string (asyncpg+ssl) — 대시보드에서 입력
        sync: false
      - key: SECRET_KEY # Render가 랜덤 생성 → config.py 기본값 덮어씀
        generateValue: true
      - key: PUBLIC_BASE_URL # 최초 배포 후 발급된 https URL로 채움 (OpenAPI servers용)
        sync: false
