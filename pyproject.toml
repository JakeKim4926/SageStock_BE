[project]
name = "sagestock-be"
version = "0.1.0"
description = "SageStock 백엔드 (FastAPI 서빙 API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 는 bcrypt 4.1+ 에서 self-test 크래시 → 호환 버전으로 핀.
    "bcrypt>=4.0,<4.1",
    "httpx>=0.28",
    "finance-datareader>=0.9.202",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
